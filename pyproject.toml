[project]
name = "cosmo_gas_fields"
version = "0.1.0"
description = "Neural fields and differentiable Voigt rendering for 3D gas density from 1D absorption spectra, with identifiability diagnostics and MLOps patterns."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "The cosmo-gas-fields authors" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.10"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmo_gas_fields"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
